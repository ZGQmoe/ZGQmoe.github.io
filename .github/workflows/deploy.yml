name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每 30 分钟看一眼各课程笔记仓库，有新提交才重新构建
  schedule:
    - cron: "*/30 * * * *"
  # 笔记仓库也可以主动通知（见 README「笔记即时更新」）
  repository_dispatch:
    types: [notes-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - uses: actions/setup-node@v4
        if: github.event_name == 'schedule'
        with:
          node-version: 22
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/notes-changed.mjs
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
